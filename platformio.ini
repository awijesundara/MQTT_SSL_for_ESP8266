; PlatformIO project configuration for the SmartHome Gateway MQTT/TLS sensor node.
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The sketch lives at the repository root (Arduino IDE layout).
src_dir = .

[env]
; Only the sketch is project source; .pio/ holds downloaded libraries.
build_src_filter = +<*> -<.pio/> -<.git/> -<.github/>

[env:d1_mini]
platform = espressif8266
board = d1_mini            ; change to your actual board (e.g. nodemcuv2, esp12e) if different
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0
    ; SSD1306Brzo (used by the sketch) needs the Brzo I2C bus driver.
    pasko-zh/Brzo I2C @ ^1.3.3

build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
